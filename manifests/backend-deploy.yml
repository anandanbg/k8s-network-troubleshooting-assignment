apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: support-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: hashicorp/http-echo:0.2.3
        args:
        - "-listen=:8080"
        - "-text=Hello from Backend!"
        ports:
        - containerPort: 8080
